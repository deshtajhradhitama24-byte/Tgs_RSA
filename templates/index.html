<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RSA Cryptography System</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & BASE ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #060810;
  --surface:   #0d1020;
  --surface2:  #131629;
  --border:    #1e2540;
  --border2:   #2a3260;
  --blue:      #3d7fff;
  --blue-dim:  #1a3d80;
  --purple:    #8b5cf6;
  --purple-dim:#3b1f7a;
  --green:     #10b981;
  --green-dim: #064e35;
  --red:       #ef4444;
  --amber:     #f59e0b;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --text3:     #475569;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Syne', sans-serif;
  --radius:    12px;
  --shadow:    0 8px 32px rgba(0,0,0,0.5);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ANIMATED BACKGROUND ─────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(61,127,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%);
  pointer-events: none;
}

.wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }

/* ── HEADER ──────────────────────────────────── */
header {
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
  display: flex; align-items: center; justify-content: space-between;
  animation: fadeDown 0.6s ease both;
}

.logo {
  display: flex; align-items: center; gap: 14px;
}
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 20px rgba(61,127,255,0.3);
}
.logo-text h1 {
  font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px;
  background: linear-gradient(90deg, var(--text), var(--text2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p {
  font-size: 0.72rem; color: var(--text3); font-family: var(--mono);
  margin-top: 2px;
}

.badge {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  letter-spacing: 0.3px;
  line-height: 1.6;
  text-align: right;
}

/* ── SECTION TITLES ──────────────────────────── */
.sec-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 16px;
}
.sec-title::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.sec-title .dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}

/* ── CARD ─────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  animation: fadeUp 0.5s ease both;
}
.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.2s; }

/* ── KEY GENERATOR ───────────────────────────── */
.gen-controls {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.gen-field {
  display: flex; align-items: center; gap: 10px;
}
.gen-field label {
  font-size: 0.8rem; font-weight: 600; color: var(--text2);
}
.gen-field select {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border2); border-radius: 8px;
  padding: 8px 14px; font-family: var(--mono); font-size: 0.85rem;
  cursor: pointer; outline: none;
  transition: border-color 0.2s;
}
.gen-field select:focus { border-color: var(--blue); }
.gen-field .static-val {
  font-family: var(--mono); font-size: 0.8rem; color: var(--text3);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px;
}

.key-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
@media(max-width:700px){ .key-grid { grid-template-columns: 1fr; } }

.key-box-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.key-box-header span {
  font-size: 0.78rem; font-weight: 700; color: var(--text2);
  letter-spacing: 0.5px;
}
.key-box-header .btn-group { display: flex; gap: 6px; }

.key-textarea {
  width: 100%; height: 160px;
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-family: var(--mono); font-size: 0.75rem;
  resize: none; outline: none; line-height: 1.6;
  transition: border-color 0.2s;
}
.key-textarea:focus { border-color: var(--blue); }
.key-textarea:read-only { cursor: default; color: var(--text2); }

/* ── CRYPTO GRID ─────────────────────────────── */
.crypto-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
@media(max-width:800px){ .crypto-grid { grid-template-columns: 1fr; } }

.crypto-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: fadeUp 0.6s ease both;
}
.crypto-panel:nth-child(2) { animation-delay: 0.15s; }

.panel-header {
  padding: 14px 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.panel-header .icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.enc .panel-header { background: rgba(61,127,255,0.06); }
.enc .panel-header .icon { background: rgba(61,127,255,0.15); }
.dec .panel-header { background: rgba(139,92,246,0.06); }
.dec .panel-header .icon { background: rgba(139,92,246,0.15); }

.panel-header h2 {
  font-size: 0.95rem; font-weight: 700;
}
.enc .panel-header h2 { color: var(--blue); }
.dec .panel-header h2 { color: var(--purple); }

.panel-body { padding: 20px; }

/* ── FORM ELEMENTS ───────────────────────────── */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 0.78rem; font-weight: 700; color: var(--text2);
  margin-bottom: 6px; letter-spacing: 0.3px;
}
.field label .info {
  display: inline-block;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--border2); color: var(--text3);
  font-size: 0.65rem; text-align: center; line-height: 14px;
  cursor: default; margin-left: 5px;
}

textarea, .output-box {
  width: 100%;
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; font-family: var(--mono); font-size: 0.78rem;
  outline: none; resize: none; line-height: 1.6;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--blue); }

.output-box {
  min-height: 90px; cursor: default;
  color: var(--text2);
}
.enc .output-box { background: #0a1628; border-color: rgba(61,127,255,0.2); }
.dec .output-box { background: #110a28; border-color: rgba(139,92,246,0.2); }

/* Key Type Radio */
.radio-group {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 14px;
}
.radio-group label {
  font-size: 0.78rem; font-weight: 700; color: var(--text2);
  margin-bottom: 0;
}
.radio-option {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.78rem; color: var(--text2); cursor: pointer;
}
.radio-option input[type=radio] { accent-color: var(--blue); }

/* Algorithm select */
.algo-select {
  width: 100%;
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 12px; font-family: var(--mono); font-size: 0.75rem;
  outline: none; cursor: pointer; margin-bottom: 16px;
  transition: border-color 0.2s;
}
.algo-select:focus { border-color: var(--blue); }

/* Output header */
.out-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.out-header label {
  font-size: 0.78rem; font-weight: 700; color: var(--text2);
}

/* ── BUTTONS ─────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--sans); font-size: 0.82rem; font-weight: 700;
  border: none; border-radius: 8px; cursor: pointer;
  transition: all 0.18s; outline: none;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  padding: 10px 24px; width: 100%;
  justify-content: center;
  color: white; margin: 14px 0 4px;
}
.enc .btn-primary {
  background: linear-gradient(135deg, #1d4ed8, var(--blue));
  box-shadow: 0 4px 16px rgba(61,127,255,0.3);
}
.enc .btn-primary:hover {
  background: linear-gradient(135deg, #1e40af, #60a5fa);
  box-shadow: 0 6px 24px rgba(61,127,255,0.45);
  transform: translateY(-1px);
}
.dec .btn-primary {
  background: linear-gradient(135deg, #6d28d9, var(--purple));
  box-shadow: 0 4px 16px rgba(139,92,246,0.3);
}
.dec .btn-primary:hover {
  background: linear-gradient(135deg, #5b21b6, #a78bfa);
  box-shadow: 0 6px 24px rgba(139,92,246,0.45);
  transform: translateY(-1px);
}

.btn-gen {
  padding: 10px 28px; color: white;
  background: linear-gradient(135deg, #065f46, var(--green));
  box-shadow: 0 4px 16px rgba(16,185,129,0.25);
  font-size: 0.85rem;
}
.btn-gen:hover {
  background: linear-gradient(135deg, #047857, #34d399);
  box-shadow: 0 6px 24px rgba(16,185,129,0.4);
  transform: translateY(-1px);
}
.btn-gen:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
}

.btn-sm {
  padding: 5px 12px; font-size: 0.72rem;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border); border-radius: 6px;
}
.btn-sm:hover { background: var(--border); color: var(--text); }

.btn-dl {
  background: rgba(16,185,129,0.1); color: var(--green);
  border-color: rgba(16,185,129,0.2);
}
.btn-dl:hover { background: rgba(16,185,129,0.2); }

/* ── SPINNER ─────────────────────────────────── */
.spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  animation: spin 0.7s linear infinite;
  display: none;
}
.loading .spinner { display: block; }
.loading .btn-text { display: none; }

/* ── TOAST ────────────────────────────────────── */
#toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 1000;
  padding: 12px 20px; border-radius: 10px;
  font-size: 0.82rem; font-weight: 600; font-family: var(--sans);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transform: translateY(20px); opacity: 0;
  transition: all 0.25s ease; pointer-events: none;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.success { background: #052e16; color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
#toast.error   { background: #2d0f0f; color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
#toast.info    { background: #0d1a35; color: var(--blue);  border: 1px solid rgba(61,127,255,0.3); }

/* ── ANIMATIONS ──────────────────────────────── */
@keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
@keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:none; } }
@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes pulse    { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <div class="logo-text">
        <h1>RSA Cryptography System</h1>
        <p>Asymmetric Key Encryption &amp; Decryption</p>
      </div>
    </div>
    <div class="badge">
      Algoritma: RSA/ECB/OAEPWithSHA-256AndMGF1Padding<br>
      Format: PKCS#1 &nbsp;|&nbsp; Library: cryptography (Python)
    </div>
  </header>

  <!-- KEY GENERATOR -->
  <div class="sec-title">
    <span class="dot" style="background:var(--green)"></span>
    Key Generator
  </div>

  <div class="card">
    <div class="gen-controls">
      <div class="gen-field">
        <label>Bits:</label>
        <select id="sel-bits">
          <option value="512">512</option>
          <option value="1024" selected>1024</option>
          <option value="2048">2048</option>
        </select>
      </div>
      <div class="gen-field">
        <label>Format:</label>
        <span class="static-val">PKCS#1</span>
      </div>
      <button class="btn btn-gen" id="btn-generate" onclick="doGenerate()">
        <span class="spinner"></span>
        <span class="btn-text">⚙ &nbsp;Generate</span>
      </button>
    </div>

    <div class="key-grid">
      <!-- Private Key -->
      <div>
        <div class="key-box-header">
          <span>Private Key</span>
          <div class="btn-group">
            <button class="btn btn-sm btn-dl" onclick="downloadKey('private')" title="Download .pem">⬇ Download</button>
            <button class="btn btn-sm" onclick="copyText('ta-priv')">⎘ Copy</button>
          </div>
        </div>
        <textarea class="key-textarea" id="ta-priv" readonly placeholder="Private key akan muncul di sini setelah Generate..."></textarea>
      </div>
      <!-- Public Key -->
      <div>
        <div class="key-box-header">
          <span>Public Key</span>
          <div class="btn-group">
            <button class="btn btn-sm btn-dl" onclick="downloadKey('public')" title="Download .pem">⬇ Download</button>
            <button class="btn btn-sm" onclick="copyText('ta-pub')">⎘ Copy</button>
          </div>
        </div>
        <textarea class="key-textarea" id="ta-pub" readonly placeholder="Public key akan muncul di sini setelah Generate..."></textarea>
      </div>
    </div>
  </div>

  <!-- ENCRYPTION & DECRYPTION -->
  <div class="sec-title" style="margin-top:12px">
    <span class="dot" style="background:var(--blue)"></span>
    Enkripsi &amp; Dekripsi
  </div>

  <div class="crypto-grid">

    <!-- ENKRIPSI -->
    <div class="crypto-panel enc">
      <div class="panel-header">
        <div class="icon">🔒</div>
        <h2>RSA Encryption</h2>
      </div>
      <div class="panel-body">
        <div class="field">
          <label>Enter Plain Text to Encrypt <span class="info">i</span></label>
          <textarea id="enc-plain" rows="4" placeholder="Ketik pesan yang ingin dienkripsi..."></textarea>
        </div>

        <div class="field">
          <label>Enter Public/Private Key <span class="info">i</span></label>
          <textarea id="enc-key" rows="6" placeholder="Paste public key di sini, atau klik Generate untuk auto-isi..."></textarea>
        </div>

        <div class="radio-group">
          <label>RSA Key Type <span class="info">i</span></label>
          <label class="radio-option"><input type="radio" name="enc-kt" value="public" checked> Public key</label>
          <label class="radio-option"><input type="radio" name="enc-kt" value="private"> Private Key</label>
        </div>

        <label style="font-size:0.78rem;font-weight:700;color:var(--text2);display:block;margin-bottom:6px">
          Select Encryption Algorithm <span class="info">i</span>
        </label>
        <select class="algo-select">
          <option>RSA/ECB/OAEPWithSHA-256AndMGF1Padding (Recommended)</option>
          <option>RSA/ECB/PKCS1Padding</option>
        </select>

        <button class="btn btn-primary" id="btn-encrypt" onclick="doEncrypt()">
          <span class="spinner"></span>
          <span class="btn-text">🔒 &nbsp;Encrypt</span>
        </button>

        <div class="out-header">
          <label>Encrypted Output (Base64):</label>
          <button class="btn btn-sm" onclick="copyText('enc-output')">⎘ Copy</button>
        </div>
        <div class="output-box" id="enc-output" style="word-break:break-all"></div>
      </div>
    </div>

    <!-- DEKRIPSI -->
    <div class="crypto-panel dec">
      <div class="panel-header">
        <div class="icon">🔓</div>
        <h2>RSA Decryption</h2>
      </div>
      <div class="panel-body">
        <div class="field">
          <label>Enter Encrypted Text to Decrypt (Base64) <span class="info">i</span></label>
          <textarea id="dec-cipher" rows="4" placeholder="Ciphertext Base64 otomatis terisi setelah Encrypt, atau paste manual..."></textarea>
        </div>

        <div class="field">
          <label>Enter Public/Private Key <span class="info">i</span></label>
          <textarea id="dec-key" rows="6" placeholder="Paste private key di sini, atau klik Generate untuk auto-isi..."></textarea>
        </div>

        <div class="radio-group">
          <label>RSA Key Type <span class="info">i</span></label>
          <label class="radio-option"><input type="radio" name="dec-kt" value="public"> Public key</label>
          <label class="radio-option"><input type="radio" name="dec-kt" value="private" checked> Private Key</label>
        </div>

        <label style="font-size:0.78rem;font-weight:700;color:var(--text2);display:block;margin-bottom:6px">
          Select Decryption Algorithm <span class="info">i</span>
        </label>
        <select class="algo-select">
          <option>RSA/ECB/OAEPWithSHA-256AndMGF1Padding (Recommended)</option>
          <option>RSA/ECB/PKCS1Padding</option>
        </select>

        <button class="btn btn-primary" id="btn-decrypt" onclick="doDecrypt()">
          <span class="spinner"></span>
          <span class="btn-text">🔓 &nbsp;Decrypt</span>
        </button>

        <div class="out-header">
          <label>Decrypted Output:</label>
          <button class="btn btn-sm" onclick="copyText('dec-output')">⎘ Copy</button>
        </div>
        <div class="output-box" id="dec-output"></div>
      </div>
    </div>

  </div><!-- /crypto-grid -->
</div><!-- /wrap -->

<!-- TOAST -->
<div id="toast"></div>

<script>
// ── TOAST ──────────────────────────────────────
let toastTimer;
function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = type; }, 3000);
}

// ── COPY ───────────────────────────────────────
function copyText(id) {
  const el = document.getElementById(id);
  const txt = el.value ?? el.textContent;
  if (!txt.trim()) { toast('Tidak ada teks untuk disalin', 'error'); return; }
  navigator.clipboard.writeText(txt.trim())
    .then(() => toast('✓ Disalin ke clipboard!', 'success'))
    .catch(() => toast('Gagal menyalin', 'error'));
}

// ── LOADING STATE ──────────────────────────────
function setLoading(btnId, state) {
  const btn = document.getElementById(btnId);
  if (state) btn.classList.add('loading');
  else btn.classList.remove('loading');
  btn.disabled = state;
}

// ── GENERATE ───────────────────────────────────
async function doGenerate() {
  setLoading('btn-generate', true);
  try {
    const bits = document.getElementById('sel-bits').value;
    const res  = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ bits })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    document.getElementById('ta-priv').value = data.private_key;
    document.getElementById('ta-pub').value  = data.public_key;
    // Auto-fill ke panel enkripsi & dekripsi
    document.getElementById('enc-key').value = data.public_key;
    document.getElementById('dec-key').value = data.private_key;
    toast(`✓ RSA ${bits}-bit key pair berhasil digenerate!`, 'success');
  } catch(e) {
    toast('✗ Generate gagal: ' + e.message, 'error');
  } finally {
    setLoading('btn-generate', false);
  }
}

// ── ENCRYPT ────────────────────────────────────
async function doEncrypt() {
  setLoading('btn-encrypt', true);
  document.getElementById('enc-output').textContent = '';
  try {
    const plain  = document.getElementById('enc-plain').value.trim();
    const pubkey = document.getElementById('enc-key').value.trim();
    if (!plain)  { toast('⚠ Masukkan pesan terlebih dahulu!', 'error'); return; }
    if (!pubkey) { toast('⚠ Masukkan Public Key terlebih dahulu!', 'error'); return; }

    const res  = await fetch('/api/encrypt', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ plaintext: plain, public_key: pubkey })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    document.getElementById('enc-output').textContent = data.ciphertext;
    // Auto-fill ke panel dekripsi
    document.getElementById('dec-cipher').value = data.ciphertext;
    toast('✓ Enkripsi berhasil!', 'success');
  } catch(e) {
    toast('✗ ' + e.message, 'error');
  } finally {
    setLoading('btn-encrypt', false);
  }
}

// ── DECRYPT ────────────────────────────────────
async function doDecrypt() {
  setLoading('btn-decrypt', true);
  document.getElementById('dec-output').textContent = '';
  try {
    const cipher  = document.getElementById('dec-cipher').value.trim();
    const privkey = document.getElementById('dec-key').value.trim();
    if (!cipher)  { toast('⚠ Masukkan ciphertext terlebih dahulu!', 'error'); return; }
    if (!privkey) { toast('⚠ Masukkan Private Key terlebih dahulu!', 'error'); return; }

    const res  = await fetch('/api/decrypt', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ ciphertext: cipher, private_key: privkey })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    document.getElementById('dec-output').textContent = data.plaintext;
    toast('✓ Dekripsi berhasil!', 'success');
  } catch(e) {
    toast('✗ ' + e.message, 'error');
  } finally {
    setLoading('btn-decrypt', false);
  }
}

// ── DOWNLOAD KEY ───────────────────────────────
async function downloadKey(type) {
  const content = type === 'public'
    ? document.getElementById('ta-pub').value
    : document.getElementById('ta-priv').value;
  if (!content.trim()) { toast('⚠ Generate key terlebih dahulu!', 'error'); return; }

  const res = await fetch('/api/download-key', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ type, content })
  });
  const blob = await res.blob();
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = type === 'public' ? 'public_key.pem' : 'private_key.pem';
  a.click();
  URL.revokeObjectURL(url);
  toast(`✓ ${type === 'public' ? 'Public' : 'Private'} key berhasil didownload!`, 'success');
}
</script>
